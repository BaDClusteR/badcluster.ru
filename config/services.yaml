services:
  BC\Core\Scanner\IWidgetClassScanner:
    class: BC\Core\Scanner\WidgetClassScanner

  BC\Core\Asset\Minifier\IMinifier:
    class: BC\Core\Asset\Minifier\MinifierFactory

  BC\Core\Asset\IAssetBuilder:
    class: BC\Core\Asset\AssetBuilder

  BC\Core\SystemMetrics\ISystemMetricsProvider:
    class: BC\Core\SystemMetrics\SystemMetricsProviderFactory

  BC\Core\SystemMetrics\ISystemMetricsHistory:
    class: BC\Core\SystemMetrics\SystemMetricsHistory

  BC\Controller\System\APIExceptionResponseController:
    decorates: ApiPlatform\Controller\System\IApiExceptionResponseController

  BC\Controller\System\APIResponseController:
    decorates: ApiPlatform\Controller\System\IApiResponseController

  BC\Logger\MaskingLogger:
    decorates: Runway\Logger\ILogger
    arguments:
      sensitiveKeys:
        - 'login'
        - 'password'
        - 'token'
        - 'X-BC-Token'
        # Positional call arguments in logged stack traces can contain credentials
        # (e.g. Auth::authenticate("login", "password")), so mask them entirely.
        - 'args'

  BC\Core\Config\IWebsiteSettings:
    class: BC\Core\Config\WebsiteSettings
    arguments:
      webRoot: '#WEB_ROOT'
      adminEmail: "admin@badcluster.ru"
      adminTelegram: "https://t.me/bad_cluster"
      adminSteam: "https://steamcommunity.com/id/bad_cluster"
      adminGithub: "https://github.com/BaDClusteR"

  BC\Core\Media\Processor\ImageProcessorAvif:
    tags:
      - name: image.processor

  BC\Core\Media\Processor\ImageProcessorWebp:
    tags:
      - name: image.processor

  BC\Core\Media\PostProcessor\ImagePostprocessor:
    arguments:
      significantSizeDifferenceBytes: 8192
    tags:
      - name: image.postprocessor

  BC\Core\Media\IThumbnailGenerator:
    class: BC\Core\Media\ThumbnailGenerator

  BC\Core\Helper\IAttributesHelper:
    class: BC\Core\Helper\AttributesHelper

  BC\Core\Auth\IAuth:
    class: BC\Core\Auth\Auth
    arguments:
      tokenStorage: '@BC\Core\Storage\CookieTokenStorage'

  BC\Core\Auth\ApiAuth:
    decorates: ApiPlatform\Core\Singleton\IAuth

  BC\Core\Storage\CookieTokenStorage: ~

  BC\Core\Storage\ApiTokenStorage:
    decorates: ApiPlatform\Core\Storage\ITokenStorage

  BC\Core\Converter\IDateConverter:
    class: BC\Core\Converter\DateConverter
    arguments:
      timezone: 'Europe/Samara'

  BC\Provider\Admin\IAppSettingsProvider:
    class: BC\Provider\Admin\AppSettingsProvider

  BC\Core\Helper\IGeoIpHelper:
    class: BC\Core\Helper\GeoIpHelper

  BC\Provider\Admin\IPageProvider:
    class: BC\Provider\Admin\PageProvider

  BC\Core\Formatter\IFormatter:
    class: BC\Core\Formatter\Formatter

  # Website-specific services
  BC\Provider\IMenuItemsProvider:
    class: BC\Provider\MenuItemsProvider

  BC\Provider\IPulseItemsProvider:
    class: BC\Provider\PulseItemsProvider

  BC\Provider\IPathsProvider:
    class: BC\Provider\PathsProvider

  BC\Generator\IThumbnailsGenerator:
    class: BC\Generator\ThumbnailsGenerator

  BC\Core\Converter\Media\IMediaConverter:
    class: BC\Core\Converter\Media\MediaConverter

  BC\Core\Helper\IBlockHelper:
    class: BC\Core\Helper\BlockHelper

  BC\Provider\ICommentsProvider:
    class: BC\Provider\CommentsProvider

  BC\Provider\ISitemapPagesProvider:
    class: BC\Provider\SitemapPagesProvider
    tags:
      - name: sitemap

  BC\Controller\Controller404:
    decorates: Runway\Controller\IController404

  BC\Provider\IRandomFactProvider:
    class: BC\Provider\RandomFactProvider


  # Controllers
  BC\Controller\Index: ~
  BC\Controller\Admin: ~
  BC\Controller\Comment: ~
