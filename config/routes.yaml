routes:
  index:
    path: /
    controller: BC\Controller\Index::run

  comment:
    path: /comment
    controller: BC\Controller\Comment::run

  # Всё под /admin, кроме API (у него свои маршруты, см. config/api): несуществующий
  # путь API — это 404 (JSON для админки), а не страница админки
  admin:
    path: /admin/{path}
    requirements:
      path: '(?!api(?:/|$)).*'
    controller: BC\Controller\Admin::index

  login:
    path: /login/notbot
    controller: BC\Controller\Admin::renderPublicPage

  admin_index:
    path: /admin
    controller: BC\Controller\Admin::index

  cringe_museum:
    path: /cringe
    controller: BC\Controller\About::renderCringeMuseum

  sitemap:
    path: /sitemap.xml
    controller: BC\Controller\Sitemap::renderSitemap

  screenshots:
    path: /screenshots
    controller: BC\Controller\About::renderScreenshots

  photos:
    path: /photo
    controller: BC\Controller\About::renderPhotos

  random_fact:
    path: /fact
    controller: BC\Controller\Index::renderRandomFact

  # Last resort: static pages live at the site root and have no prefix of their
  # own. A static path (/blog, /fact) beats this placeholder whatever the order,
  # so the catch-all gets only the paths no other route has; an unknown slug is
  # the regular 404 (see StaticPage::render()).
  # The route wildcard is a single segment, so nothing nested is affected.
  static_page:
    path: /{slug}
    controller: BC\Controller\StaticPage::render
