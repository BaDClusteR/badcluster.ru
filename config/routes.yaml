routes:
  index:
    path: /
    controller: BC\Controller\Index::run

  comment:
    path: /comment
    controller: BC\Controller\Comment::run

  admin:
    path: /admin/.*
    controller: BC\Controller\Admin::index

  login:
    path: /login/notbot
    controller: BC\Controller\Admin::renderPublicPage

  admin_index:
    path: /admin
    controller: BC\Controller\Admin::index

  about:
    path: /me
    controller: BC\Controller\About::renderAboutMe

  history:
    path: /history
    controller: BC\Controller\About::renderHistory

  cringe_museum:
    path: /cringe
    controller: BC\Controller\About::renderCringeMuseum

  sitemap:
    path: /sitemap.xml
    controller: BC\Controller\Sitemap::renderSitemap

  screenshots:
    path: /screenshots
    controller: BC\Controller\About::renderScreenshots

  photos:
    path: /photo
    controller: BC\Controller\About::renderPhotos

  random_fact:
    path: /fact
    controller: BC\Controller\Index::renderRandomFact
