name: CI

on:
  push:
    branches: [main]
  pull_request:

# The actions are pinned to commits (a tag can be moved to other code); Dependabot updates them, see dependabot.yml.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The private module modules/Secret (a submodule) is not checked out: the tests and the analysis run without it
# (tests/config/test.env does not enable it).

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The site requires PHP 8.5 (composer.json).
        php: ['8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The extensions of the site and Runway; SQLite for the test database.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, mbstring, openssl, pdo, pdo_sqlite, simplexml, yaml, zip
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # Unit, integration (the container of the site, SQLite in memory) and E2E (the PHP built-in server).
      - name: Tests
        run: vendor/bin/phpunit

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: curl, dom, fileinfo, gd, mbstring, openssl, pdo, pdo_sqlite, simplexml, yaml, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: PHPStan
        run: vendor/bin/phpstan --no-progress --memory-limit=2G --error-format=github

  mutation-testing:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: curl, dom, fileinfo, gd, mbstring, openssl, pdo, pdo_sqlite, simplexml, yaml, zip
          coverage: pcov

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # The minimal MSI is in infection.json5; the escaped mutants are shown as annotations.
      - name: Infection
        run: vendor/bin/infection --threads=max --no-progress --logger-github
